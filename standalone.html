<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSmart</title>
  <!-- React and Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Header component
    function Header({ cartCount, cartTotal, showCart, setShowCart }) {
      return (
        <header style={{ borderBottom: '2px solid black', paddingBottom: '10px', marginBottom: '20px' }}>
          <h1>ShopSmart</h1>
          <p>Simple Online Store</p>
          <button 
            onClick={() => setShowCart(!showCart)}
            style={{ padding: '8px 12px', cursor: 'pointer' }}
          >
            {showCart ? 'Hide Cart' : 'View Cart'} ({cartCount} items - ${cartTotal.toFixed(2)})
          </button>
        </header>
      );
    }

    // Filter and search component
    function Filters({ 
      searchText, 
      setSearchText, 
      categories, 
      selectedCategory, 
      setSelectedCategory, 
      sortBy, 
      setSortBy,
      resetFilters 
    }) {
      return (
        <div style={{ border: '1px solid gray', padding: '15px', marginBottom: '20px' }}>
          <div style={{ marginBottom: '10px' }}>
            <label><b>Search Products: </b></label>
            <input
              type="text"
              placeholder="Type product name..."
              value={searchText}
              onChange={(e) => setSearchText(e.target.value)}
              style={{ padding: '5px' }}
            />
          </div>

          <div style={{ marginBottom: '10px' }}>
            <label><b>Filter by Category: </b></label>
            <select 
              value={selectedCategory} 
              onChange={(e) => setSelectedCategory(e.target.value)}
              style={{ padding: '5px' }}
            >
              <option value="">All Categories</option>
              {categories.map((cat, index) => {
                const name = typeof cat === 'object' ? cat.name : cat;
                const slug = typeof cat === 'object' ? cat.slug : cat;
                return (
                  <option key={index} value={slug}>
                    {name}
                  </option>
                );
              })}
            </select>
          </div>

          <div style={{ marginBottom: '10px' }}>
            <label><b>Sort Products: </b></label>
            <select 
              value={sortBy} 
              onChange={(e) => setSortBy(e.target.value)}
              style={{ padding: '5px' }}
            >
              <option value="">Normal</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating-asc">Rating: Low to High</option>
              <option value="rating-desc">Rating: High to Low</option>
            </select>
          </div>

          <button onClick={resetFilters} style={{ padding: '5px 10px', cursor: 'pointer' }}>
            Reset All
          </button>
        </div>
      );
    }

    // Product card component
    function ProductCard({ product, onViewDetails, onAddToCart }) {
      return (
        <div style={{ border: '1px solid black', padding: '10px', width: '220px', margin: '10px' }}>
          <img 
            src={product.thumbnail} 
            alt={product.title} 
            style={{ width: '100%', height: '140px', objectFit: 'contain' }}
          />
          <h4>{product.title}</h4>
          <p>Category: {product.category}</p>
          <p><b>Price: ${product.price}</b></p>
          <p>Rating: ⭐ {product.rating} / 5</p>

          <div style={{ marginTop: '10px' }}>
            <button 
              onClick={() => onViewDetails(product)} 
              style={{ marginRight: '5px', padding: '5px', cursor: 'pointer' }}
            >
              View Details
            </button>
            <button 
              onClick={() => onAddToCart(product)} 
              style={{ padding: '5px', cursor: 'pointer' }}
            >
              Add to Cart
            </button>
          </div>
        </div>
      );
    }

    // Product list component
    function ProductList({ products, loading, onViewDetails, onAddToCart }) {
      if (loading) {
        return <h3>Loading products, please wait...</h3>;
      }
      if (products.length === 0) {
        return <p>No products found.</p>;
      }
      return (
        <div style={{ display: 'flex', flexWrap: 'wrap' }}>
          {products.map((product) => (
            <ProductCard
              key={product.id}
              product={product}
              onViewDetails={onViewDetails}
              onAddToCart={onAddToCart}
            />
          ))}
        </div>
      );
    }

    // Product details component
    function ProductDetails({ product, onClose, onAddToCart }) {
      if (!product) return null;

      return (
        <div style={{ border: '2px solid blue', padding: '15px', marginBottom: '20px' }}>
          <button onClick={onClose} style={{ marginBottom: '10px', padding: '5px 10px', cursor: 'pointer' }}>
            &larr; Back to Products
          </button>

          <h2>{product.title}</h2>
          <img 
            src={product.thumbnail} 
            alt={product.title} 
            style={{ width: '200px', height: '180px', objectFit: 'contain' }}
          />
          <p><b>Brand:</b> {product.brand || 'No brand'}</p>
          <p><b>Category:</b> {product.category}</p>
          <p><b>Description:</b> {product.description}</p>
          <p><b>Price:</b> ${product.price} ({product.discountPercentage}% discount)</p>
          <p><b>Rating:</b> ⭐ {product.rating} / 5</p>
          <p><b>Stock:</b> {product.stock} items left</p>
          <p><b>Warranty:</b> {product.warrantyInformation || 'Standard warranty'}</p>
          <p><b>Return Policy:</b> {product.returnPolicy || '7 days return'}</p>

          <button 
            onClick={() => onAddToCart(product)} 
            style={{ padding: '8px 16px', fontSize: '14px', cursor: 'pointer' }}
          >
            Add to Cart
          </button>

          {product.reviews && product.reviews.length > 0 && (
            <div style={{ marginTop: '15px' }}>
              <h3>Reviews:</h3>
              {product.reviews.map((rev, i) => (
                <div key={i} style={{ borderTop: '1px solid gray', paddingTop: '5px' }}>
                  <p><b>{rev.reviewerName}</b> ({rev.rating} ⭐): {rev.comment}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Cart component
    function Cart({ showCart, cart, increaseQty, decreaseQty, removeItem, clearCart, cartTotal }) {
      if (!showCart) return null;

      return (
        <div style={{ border: '2px solid black', padding: '15px', marginBottom: '20px' }}>
          <h2>Your Cart</h2>

          {cart.length === 0 ? (
            <p>Your cart is empty.</p>
          ) : (
            <div>
              <table border="1" cellPadding="8" style={{ borderCollapse: 'collapse', width: '100%' }}>
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {cart.map((item) => (
                    <tr key={item.id}>
                      <td>{item.title}</td>
                      <td>${item.price}</td>
                      <td>
                        <button onClick={() => decreaseQty(item.id)} style={{ padding: '2px 8px' }}>-</button>
                        <span style={{ margin: '0 10px' }}>{item.quantity}</span>
                        <button onClick={() => increaseQty(item.id)} style={{ padding: '2px 8px' }}>+</button>
                      </td>
                      <td>${(item.price * item.quantity).toFixed(2)}</td>
                      <td>
                        <button onClick={() => removeItem(item.id)} style={{ color: 'red' }}>Remove</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div style={{ marginTop: '15px' }}>
                <h3>Total Amount: ${cartTotal.toFixed(2)}</h3>
                <button onClick={clearCart} style={{ padding: '5px 10px' }}>Empty Cart</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Pagination component
    function Pagination({ page, totalPages, prevPage, nextPage }) {
      return (
        <div style={{ textAlign: 'center', marginTop: '20px', padding: '10px' }}>
          <button onClick={prevPage} disabled={page <= 1} style={{ padding: '6px 12px' }}>
            Previous
          </button>
          <span style={{ margin: '0 15px' }}>
            Page {page} of {totalPages}
          </span>
          <button onClick={nextPage} disabled={page >= totalPages} style={{ padding: '6px 12px' }}>
            Next
          </button>
        </div>
      );
    }

    // Main App component
    function App() {
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [loading, setLoading] = useState(false);

      const [searchText, setSearchText] = useState('');
      const [debouncedSearch, setDebouncedSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('');
      const [sortBy, setSortBy] = useState('');

      const [page, setPage] = useState(1);
      const [totalProducts, setTotalProducts] = useState(0);
      const limit = 10;

      const [selectedProduct, setSelectedProduct] = useState(null);
      const [cart, setCart] = useState([]);
      const [showCart, setShowCart] = useState(false);

      // Debouncing search
      useEffect(() => {
        const timer = setTimeout(() => {
          setDebouncedSearch(searchText);
          setPage(1);
        }, 500);

        return () => clearTimeout(timer);
      }, [searchText]);

      // Fetch categories
      useEffect(() => {
        fetch('https://dummyjson.com/products/categories')
          .then((res) => res.json())
          .then((data) => setCategories(data))
          .catch((err) => console.log('Error fetching categories:', err));
      }, []);

      // Fetch products
      useEffect(() => {
        setLoading(true);
        const skip = (page - 1) * limit;

        let apiUrl = `https://dummyjson.com/products?limit=${limit}&skip=${skip}`;

        if (debouncedSearch !== '') {
          apiUrl = `https://dummyjson.com/products/search?q=${debouncedSearch}&limit=${limit}&skip=${skip}`;
        } else if (selectedCategory !== '') {
          apiUrl = `https://dummyjson.com/products/category/${selectedCategory}?limit=${limit}&skip=${skip}`;
        }

        if (sortBy !== '') {
          const parts = sortBy.split('-');
          const field = parts[0];
          const order = parts[1];
          apiUrl = apiUrl + `&sortBy=${field}&order=${order}`;
        }

        fetch(apiUrl)
          .then((res) => res.json())
          .then((data) => {
            let items = data.products || [];

            if (sortBy === 'price-asc') {
              items.sort((a, b) => a.price - b.price);
            } else if (sortBy === 'price-desc') {
              items.sort((a, b) => b.price - a.price);
            } else if (sortBy === 'rating-asc') {
              items.sort((a, b) => a.rating - b.rating);
            } else if (sortBy === 'rating-desc') {
              items.sort((a, b) => b.rating - a.rating);
            }

            setProducts(items);
            setTotalProducts(data.total || 0);
            setLoading(false);
          })
          .catch((err) => {
            console.log('Error fetching products:', err);
            setLoading(false);
          });
      }, [page, debouncedSearch, selectedCategory, sortBy]);

      function resetFilters() {
        setSearchText('');
        setDebouncedSearch('');
        setSelectedCategory('');
        setSortBy('');
        setPage(1);
      }

      function addToCart(product) {
        const existing = cart.find((item) => item.id === product.id);
        if (existing) {
          const updated = cart.map((item) => {
            if (item.id === product.id) {
              return { ...item, quantity: item.quantity + 1 };
            }
            return item;
          });
          setCart(updated);
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
        alert(`${product.title} added to cart!`);
      }

      function increaseQty(id) {
        const updated = cart.map((item) => {
          if (item.id === id) {
            return { ...item, quantity: item.quantity + 1 };
          }
          return item;
        });
        setCart(updated);
      }

      function decreaseQty(id) {
        const updated = cart
          .map((item) => {
            if (item.id === id) {
              return { ...item, quantity: item.quantity - 1 };
            }
            return item;
          })
          .filter((item) => item.quantity > 0);

        setCart(updated);
      }

      function removeItem(id) {
        const updated = cart.filter((item) => item.id !== id);
        setCart(updated);
      }

      function clearCart() {
        setCart([]);
      }

      let cartTotal = 0;
      let cartCount = 0;
      for (let i = 0; i < cart.length; i++) {
        cartTotal += cart[i].price * cart[i].quantity;
        cartCount += cart[i].quantity;
      }

      const totalPages = Math.ceil(totalProducts / limit) || 1;

      function prevPage() {
        if (page > 1) setPage(page - 1);
      }

      function nextPage() {
        if (page < totalPages) setPage(page + 1);
      }

      return (
        <div style={{ padding: '20px', fontFamily: 'Arial, sans-serif', maxWidth: '1000px', margin: '0 auto' }}>
          <Header
            cartCount={cartCount}
            cartTotal={cartTotal}
            showCart={showCart}
            setShowCart={setShowCart}
          />
          <Cart
            showCart={showCart}
            cart={cart}
            increaseQty={increaseQty}
            decreaseQty={decreaseQty}
            removeItem={removeItem}
            clearCart={clearCart}
            cartTotal={cartTotal}
          />
          <ProductDetails
            product={selectedProduct}
            onClose={() => setSelectedProduct(null)}
            onAddToCart={addToCart}
          />
          <Filters
            searchText={searchText}
            setSearchText={setSearchText}
            categories={categories}
            selectedCategory={selectedCategory}
            setSelectedCategory={(cat) => {
              setSelectedCategory(cat);
              setPage(1);
            }}
            sortBy={sortBy}
            setSortBy={setSortBy}
            resetFilters={resetFilters}
          />
          <p>Showing {products.length} of {totalProducts} products (Page {page} of {totalPages})</p>
          <ProductList
            products={products}
            loading={loading}
            onViewDetails={(item) => setSelectedProduct(item)}
            onAddToCart={addToCart}
          />
          <Pagination
            page={page}
            totalPages={totalPages}
            prevPage={prevPage}
            nextPage={nextPage}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
